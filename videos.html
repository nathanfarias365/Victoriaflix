<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossos Vídeos - Victoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050505;
      --text: #f5f5f5;
      --muted: rgba(255, 255, 255, 0.75);
      --accent: #e50914;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #070707 0%, #020202 100%);
      color: var(--text);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 2rem;
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(16px);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .logo img {
      height: 48px;
      width: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.4rem;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    main {
      padding: 3rem 2rem;
    }

    .videos-title {
      font-size: 2.5rem;
      margin-bottom: 3rem;
      text-align: center;
    }

    .videos-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .video-section {
      margin-bottom: 4rem;
    }

    .section-title {
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }

    .video-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .video-title {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .video-player {
      width: 100%;
      border-radius: 12px;
      background: #000;
    }

    @media (max-width: 720px) {
      main {
        padding: 2rem 1rem;
      }

      .videos-title {
        font-size: 1.8rem;
      }

      .video-player {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo"><img src="pngwing.com.png" alt="Logo Netflix" width="48" height="auto"></div>
    </div>
    <div class="topbar-right">
      <a href="index.html" class="btn">← Voltar</a>
    </div>
  </header>

  <main>
    <div class="videos-container">
      <h1 class="videos-title">Nossos Vídeos 💕</h1>

      <div class="video-section">
        <h2 class="section-title">🎬 Meu Vídeo</h2>
        <div class="video-card">
          <div class="video-title">Meu Vídeo Especial</div>
          <video class="video-player" controls controlsList="nodownload">
            <source src="meu video.mp4" type="video/mp4">
            Seu navegador não suporta reprodução de vídeo HTML5.
          </video>
        </div>
      </div>

      <div class="video-section">
        <h2 class="section-title">👫 Nosso Vídeo Juntos</h2>
        <div class="video-card">
          <div class="video-title">Você e Eu</div>
          <video class="video-player" controls controlsList="nodownload">
            <source src="video meu e dela.mp4" type="video/mp4">
            Seu navegador não suporta reprodução de vídeo HTML5.
          </video>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
